[project]
name = "yt-caption-api"
version = "0.1.0"
description = "Small API wrapper around yt-dlp for YouTube transcripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.10.0",
    "fastapi>=0.116.0",
    "pydantic>=2.11.0",
    "uvicorn>=0.35.0",
    "yt-dlp>=2025.3.31",
]

[tool.uv]
package = false
